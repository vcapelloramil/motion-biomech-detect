[pytest]
# "backend" para poder importar app.* sin instalar el paquete.
# "tests" para poder importar los helpers compartidos (tests/video_fixtures.py)
# desde tests/unit/ y tests/integration/.
pythonpath = backend tests
testpaths = tests
python_files = test_*.py
markers =
    slow: prueba que tarda (decodifica y hashea video real). Correr con -m slow o excluir con -m "not slow".
    requiere_supabase: prueba de integración contra un proyecto Supabase real (SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY). Se salta si no están configuradas.
    requiere_render: prueba contra el servicio desplegado en Render (KINETIQ_API_URL, KINETIQ_API_TOKEN, además de las de Supabase). SOLO corre con  pytest -m requiere_render  (tests/conftest.py la salta en cualquier otra corrida); el servicio gratuito puede tardar ~1 min en despertar.
