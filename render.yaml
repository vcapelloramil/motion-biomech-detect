# Blueprint de Render para el contenedor del motor — Etapa 4.5, tarea 4.5.4.
#
# NINGÚN secreto vive en este archivo. SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY se cargan A MANO en el panel de Render (Environment del servicio)
# después de aplicar este blueprint — `sync: false` le dice a Render que el valor existe
# pero no lo gestiona este archivo ni el repo; Render los pide al aplicar el blueprint, o
# se cargan después desde el panel.
#
# plan: free para la medición de la tarea 4.5.4 (decisión 018: se mide una sola vez contra
# el plan gratis; si no entra —más de 10 minutos por golpe, o la suspensión por
# inactividad corta un análisis en curso—, se pasa a starter y se actualiza este archivo
# junto con la decisión 017).
services:
  - type: web
    name: kinetiq-motor
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Orígenes del frontend que pueden llamar a la API, separados por comas (p. ej. https://kinetiq.pages.dev).
      # Sin valor, ninguno. No es un secreto, pero depende del dominio publicado: se carga en el panel.
      - key: KINETIQ_CORS_ORIGINS
        sync: false
