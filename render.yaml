# Blueprint de Render para el contenedor del motor — Etapa 4.5, tarea 4.5.4.
#
# NINGÚN secreto vive en este archivo. SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY se cargan A MANO en el panel de Render (Environment del servicio)
# después de aplicar este blueprint — `sync: false` le dice a Render que el valor existe
# pero no lo gestiona este archivo ni el repo; Render los pide al aplicar el blueprint, o
# se cargan después desde el panel.
#
# plan: standard (1 CPU, 2 GB, USD 25/mes) desde el 12/10/2026 (decisión 023, actualización del 12/10): en Free un golpe
# de 3 s tardaba 11 min 18 s y el margen de memoria era de 32 MB, y los fotogramas clave con esqueleto (decisión 033)
# suman un proceso de ffmpeg de ~56 MB. Cambió Valentín en el panel; este archivo lo sigue. Después de la defensa se
# puede volver a free (en el mismo paso: panel, este archivo y la bitácora).
services:
  - type: web
    name: kinetiq-motor
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Orígenes del frontend que pueden llamar a la API, separados por comas: hoy https://kinetiqtennis.me, https://kinetiq.v-capelloramil.workers.dev y http://localhost:8080.
      # Sin valor, ninguno. No es un secreto, pero depende del dominio publicado: se carga en el panel.
      - key: KINETIQ_CORS_ORIGINS
        sync: false
